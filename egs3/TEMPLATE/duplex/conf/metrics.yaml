##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure \
#       --inference_config conf/inference.yaml --metrics_config conf/metrics.yaml
#
# Shared default merged under every duplex recipe's metrics config.
# `exp_tag` and `inference_dir` come from the inference config. A recipe that
# sets `metrics:` replaces this list, so it lists StepTime again.

recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}

metrics:
  # Mean wall-clock time of a frame; live serving needs under 80 ms.
  - metric:
      _target_: espnet3.systems.duplex.metrics.step_time.StepTime
    inputs:
      step_ms: step_ms
