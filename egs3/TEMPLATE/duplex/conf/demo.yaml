##########################################################
#                    DEMO PACK SETTING                   #
##########################################################
# Quick usage (after pack_model, on a GPU node for the app):
#   python run.py --stages pack_demo   --demo_config conf/demo.yaml
#   python exp/<exp_tag>/demo/app.py --demo-dir exp/<exp_tag>/demo
#   python run.py --stages upload_demo --demo_config conf/demo.yaml
#
# A full-duplex conversation through the browser microphone: the browser
# streams the microphone to the app, which feeds the model one 80 ms frame at
# a time and streams its voice and text back. See the system README for
# serving it from a cluster node.

recipe_dir: .

##########################################################
#                    MODEL SOURCE                        #
##########################################################
# `model.dir_or_tag` selects the packed model the demo loads through
# InferenceModel: the `pack_model` output (default), or a Hugging Face repo
# holding one. `launch()` fills in exp_tag from the training config.
model:
  dir_or_tag: exp/${exp_tag}/model_pack
  device: cuda

# PersonaPlex's role prompt, the same for every conversation of the demo (for
# example "You enjoy having a good conversation."); Moshi takes none.
role_prompt:

##########################################################
#                     UI DEFINITION                      #
##########################################################
# `ui.app_script` is copied into the packed demo as `app.py`.
# The conversation streams, so the UI is set here rather than generated from
# the inference contract:
# - `microphone_stream`: the user's microphone, streamed to the model
# - `audio_stream`: the model's voice, streamed back
# - `text`: the model's inner monologue so far
ui:
  app_script: ${config_path:../src/app.py}
  title: ${set_corpus_and_system:} demo
  description: >-
    Press record and talk. The model listens and speaks at the same time, so
    you can interrupt it or back-channel while it talks. Use headphones: it
    hears whatever reaches your microphone, its own voice included.
  inputs:
    - key: speech
      type: microphone_stream
      label: "You (microphone)"
  outputs:
    - key: wav
      type: audio_stream
      label: "Model"
    - key: text
      type: text
      label: "Inner monologue"

##########################################################
#                    PACKING SETTING                     #
##########################################################
pack:
  out_dir: exp/${exp_tag}/demo
  include: []
  exclude: []
  requirements:
    - espnet[duplex,demo] @ git+https://github.com/espnet/espnet.git
    - soxr
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001f5e3️"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: "false"
    license: cc-by-4.0
    tags: |-
      - espnet
      - espnet3
      - gradio
      - full-duplex
      - spoken-dialogue
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}

##########################################################
#                    UPLOAD SETTING                      #
##########################################################
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  update: false
  delete_patterns:
    - "*"
