builder:
  # Full-Duplex-Bench v1.0 (Lin et al., 2025), pinned to one revision.
  hf_repo: Ssshangfu/Full-Duplex-Bench-Data
  revision: a3579cb9ebbe164204b196e33d4d0e91860eb90e
  version: v1.0
  download_dir: downloads
  # Per-sample backchannel timing of the ICC references, from the benchmark's
  # evaluation code at a pinned commit; the backchannel JSD compares to it.
  backchannel_reference_url: https://raw.githubusercontent.com/DanielLin94144/Full-Duplex-Bench/3e799c45a045256f47d5f1c9cda90157e2d2ec9e/v1_v1.5/evaluation/icc_gt_distribution.json
  backchannel_reference: icc_gt_distribution.json

# Each task: the annotation file of its samples (where the pause, the end of
# the user's turn or the interruption is; backchannel samples have none) and
# its number of samples, which the builder checks after extraction.
tasks:
  candor_pause_handling:
    annotation: pause.json
    samples: 216
  candor_turn_taking:
    annotation: turn_taking.json
    samples: 119
  icc_backchannel:
    annotation:
    samples: 55
  synthetic_pause_handling:
    annotation: pause.json
    samples: 137
  synthetic_user_interruption:
    annotation: interrupt.json
    samples: 200
